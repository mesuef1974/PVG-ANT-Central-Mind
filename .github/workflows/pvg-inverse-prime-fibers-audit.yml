name: PVG Inverse Prime Fibers Audit

on:
  pull_request:
    paths:
      - 'governance/readiness/ENGINE-004-INVERSE-PRIME-FIBERS.md'
      - 'governance/checkpoints/ENGINE-004-CENTERED-GAP-COORDINATES-001.md'
      - 'tools/pvg_inverse_prime_fibers.py'
      - 'tests/test_pvg_inverse_prime_fibers.py'
      - 'research/pvg-space-deepening/engine-004-inverse-prime-fibers.md'
      - 'research/pvg-space-deepening/data/inverse-prime-fibers-summary.json'
      - '.github/workflows/pvg-inverse-prime-fibers-audit.yml'
      - 'registries/program-goals.jsonl'
      - 'registries/goal-state-overrides-engine-004.jsonl'
  push:
    branches: [main]
    paths:
      - 'governance/readiness/ENGINE-004-INVERSE-PRIME-FIBERS.md'
      - 'governance/checkpoints/ENGINE-004-CENTERED-GAP-COORDINATES-001.md'
      - 'tools/pvg_inverse_prime_fibers.py'
      - 'tests/test_pvg_inverse_prime_fibers.py'
      - 'research/pvg-space-deepening/engine-004-inverse-prime-fibers.md'
      - 'research/pvg-space-deepening/data/inverse-prime-fibers-summary.json'
      - '.github/workflows/pvg-inverse-prime-fibers-audit.yml'
      - 'registries/program-goals.jsonl'
      - 'registries/goal-state-overrides-engine-004.jsonl'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile tools/pvg_inverse_prime_fibers.py
          python -m py_compile tests/test_pvg_inverse_prime_fibers.py
      - name: Unit and complete-box verification
        run: python -m unittest -v tests/test_pvg_inverse_prime_fibers.py
      - name: Registered centered-gap certificate
        run: |
          python tools/pvg_inverse_prime_fibers.py --registered-summary --output /tmp/engine004.json --compact > /tmp/engine004-stdout.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/engine004.json').read_text(encoding='utf-8'))
          certificate = json.loads(
              Path('research/pvg-space-deepening/data/inverse-prime-fibers-summary.json').read_text(encoding='utf-8')
          )
          digest = hashlib.sha256(Path('/tmp/engine004-stdout.json').read_bytes()).hexdigest()

          assert digest == certificate['canonical_compact_sha256']
          assert data['scope'] == certificate['scope']
          assert data['totals'] == certificate['totals']
          assert data['support_route_totals'] == certificate['support_route_totals']
          assert data['frozen_box_exceptions'] == certificate['frozen_box_exceptions']
          assert data['global_maximum'] == certificate['global_maximum']
          assert data['verification'] == certificate['verification']
          assert data['claim_ceiling'] == certificate['claim_ceiling']

          assert data['totals']['integer_point_count'] == 884
          assert data['totals']['representable_integer_count'] == 745
          assert data['totals']['nonrepresentable_integer_count'] == 139
          assert data['totals']['total_representation_count'] == 218024
          assert data['totals']['centered_gap_coordinate_count'] == 218024
          assert data['totals']['independent_scan_mismatch_count'] == 0
          assert data['support_route_totals']['contains_axis_2']['integer_point_count'] == 653
          assert data['support_route_totals']['excludes_axis_2']['integer_point_count'] == 231
          assert data['frozen_box_exceptions']['contains_axis_2_nonrepresentable_integers'] == [2, 4, 6]
          assert data['global_maximum']['integer'] == 97200
          assert data['global_maximum']['representation_count'] == 1557
          assert all(data['verification'].values())
          assert data['claim_ceiling']['phase_d_authorized'] is False
          assert data['claim_ceiling']['goldbach_progress'] is False
          assert data['claim_ceiling']['pnt_progress'] is False
          assert data['claim_ceiling']['rh_progress'] is False
          assert data['claim_ceiling']['grh_progress'] is False
          PY
      - name: Goal memory
        run: |
          python tools/research_compass_audit.py
          python tools/goal_memory_traceability_audit.py
