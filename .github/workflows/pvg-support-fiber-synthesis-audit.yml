name: PVG Support-Fiber Synthesis Audit

on:
  pull_request:
    paths:
      - 'research/pvg-space-deepening/synthesis-001-support-fiber-dynamics.md'
      - 'governance/readiness/SYNTHESIS-001-SUPPORT-FIBER-DYNAMICS.md'
      - 'tests/test_pvg_support_fiber_synthesis.py'
      - 'tools/pvg_deep_orbit_preimage_families.py'
      - 'tools/pvg_local_additive_cell_atlas.py'
      - 'tools/sync_pvg_inverse_geometry_worktree.ps1'
      - '.github/workflows/pvg-support-fiber-synthesis-audit.yml'
  push:
    branches: [main]
    paths:
      - 'research/pvg-space-deepening/synthesis-001-support-fiber-dynamics.md'
      - 'governance/readiness/SYNTHESIS-001-SUPPORT-FIBER-DYNAMICS.md'
      - 'tests/test_pvg_support_fiber_synthesis.py'
      - 'tools/pvg_deep_orbit_preimage_families.py'
      - 'tools/pvg_local_additive_cell_atlas.py'
      - 'tools/sync_pvg_inverse_geometry_worktree.ps1'
      - '.github/workflows/pvg-support-fiber-synthesis-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tests/test_pvg_support_fiber_synthesis.py
      - name: Support-fiber synthesis tests
        run: python -m unittest -v tests/test_pvg_support_fiber_synthesis.py
      - name: Goal-memory state
        run: |
          python tools/research_compass_audit.py
          python tools/goal_memory_traceability_audit.py
      - name: Verify active and queued goals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          goals = [
              json.loads(line)
              for line in Path('registries/program-goals.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          by_id = {row['id']: row for row in goals}
          assert by_id['GOAL-OP-SUPPORT-FIBER-SYNTHESIS-001']['status'] == 'active_current'
          assert by_id['GOAL-OP-REVERSE-SUPPORT-PREIMAGE-001']['status'] == 'queued_next'
          assert by_id['GOAL-OP-ONE-THEOREM-001']['status'] == 'paused_governed_return_required'
          assert 'GOAL-OP-ONE-THEOREM-001' in by_id['GOAL-OP-REVERSE-SUPPORT-PREIMAGE-001']['return_to_goal_ids']
          PY
