name: PVG Inverse Geometry Audit

on:
  pull_request:
    paths:
      - 'maps/pvg-point-classification-and-inverse-geometry-v1.md'
      - 'maps/pvg-local-neighborhood-and-axis-ratio-geometry-v1.md'
      - 'research/pvg-space-deepening/README.md'
      - 'research/pvg-space-deepening/pass-003-prime-pair-edge-atlas.md'
      - 'research/pvg-space-deepening/data/prime-pair-edge-atlas-primes-le-100-summary.json'
      - 'tools/pvg_inverse_geometry.py'
      - 'tools/pvg_local_neighborhood.py'
      - 'tools/pvg_prime_pair_edge_atlas.py'
      - 'tools/sync_pvg_inverse_geometry_worktree.ps1'
      - 'tests/test_pvg_inverse_geometry.py'
      - 'tests/test_pvg_local_neighborhood.py'
      - 'tests/test_pvg_prime_pair_edge_atlas.py'
      - 'governance/programs/PVG-INVERSE-GEOMETRY-001.md'
      - 'governance/checkpoints/PVG-INVERSE-GEOMETRY-001.md'
      - '.github/workflows/pvg-inverse-geometry-audit.yml'
  push:
    branches: [main]
    paths:
      - 'maps/pvg-point-classification-and-inverse-geometry-v1.md'
      - 'maps/pvg-local-neighborhood-and-axis-ratio-geometry-v1.md'
      - 'research/pvg-space-deepening/README.md'
      - 'research/pvg-space-deepening/pass-003-prime-pair-edge-atlas.md'
      - 'research/pvg-space-deepening/data/prime-pair-edge-atlas-primes-le-100-summary.json'
      - 'tools/pvg_inverse_geometry.py'
      - 'tools/pvg_local_neighborhood.py'
      - 'tools/pvg_prime_pair_edge_atlas.py'
      - 'tools/sync_pvg_inverse_geometry_worktree.ps1'
      - 'tests/test_pvg_inverse_geometry.py'
      - 'tests/test_pvg_local_neighborhood.py'
      - 'tests/test_pvg_prime_pair_edge_atlas.py'
      - 'governance/programs/PVG-INVERSE-GEOMETRY-001.md'
      - 'governance/checkpoints/PVG-INVERSE-GEOMETRY-001.md'
      - '.github/workflows/pvg-inverse-geometry-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile tools/pvg_inverse_geometry.py
          python -m py_compile tools/pvg_local_neighborhood.py
          python -m py_compile tools/pvg_prime_pair_edge_atlas.py
          python -m py_compile tests/test_pvg_inverse_geometry.py
          python -m py_compile tests/test_pvg_local_neighborhood.py
          python -m py_compile tests/test_pvg_prime_pair_edge_atlas.py
      - name: PowerShell sync-script syntax check
        shell: pwsh
        run: |
          $source = Get-Content -Raw tools/sync_pvg_inverse_geometry_worktree.ps1
          $null = [scriptblock]::Create($source)
          Write-Host 'Safe local worktree sync script syntax: PASS'
      - name: Unit tests
        run: |
          python -m unittest -v tests/test_pvg_inverse_geometry.py
          python -m unittest -v tests/test_pvg_local_neighborhood.py
          python -m unittest -v tests/test_pvg_prime_pair_edge_atlas.py
      - name: Exact passport smoke test
        run: |
          python tools/pvg_inverse_geometry.py 900 --compact > /tmp/pvg-passport-900.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/pvg-passport-900.json').read_text())
          assert p['support'] == [2, 3, 5]
          assert p['omega'] == 3
          assert p['Omega'] == 6
          assert p['primitive_ray']['primitive_generator'] == 30
          assert p['primitive_ray']['ray_index'] == 2
          print('PVG inverse-geometry passport smoke test: PASS')
          PY
      - name: Local neighborhood smoke test
        run: |
          python tools/pvg_local_neighborhood.py 30 --steps 3 --compact > /tmp/pvg-local-30.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/pvg-local-30.json').read_text())
          assert p['support'] == [2, 3, 5]
          assert p['horizontal_root_lattice'] == 'A_2'
          assert p['ordered_horizontal_degree'] == 6
          assert {x['neighbor'] for x in p['primitive_horizontal_neighbors']} == {12,18,20,45,50,75}
          assert {x['vertex'] for x in p['horizontal_simplex_vertices']} == {8,27,125}
          print('PVG local-neighborhood smoke test: PASS')
          PY
      - name: Prime-pair edge atlas deterministic regeneration
        run: |
          mkdir -p /tmp/pvg-prime-pair-atlas
          python tools/pvg_prime_pair_edge_atlas.py --limit 100 --output-dir /tmp/pvg-prime-pair-atlas
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          generated_dir = Path('/tmp/pvg-prime-pair-atlas')
          generated_summary = json.loads(
              (generated_dir / 'prime-pair-edge-atlas-primes-le-100-summary.json').read_text()
          )
          committed_summary = json.loads(
              Path('research/pvg-space-deepening/data/prime-pair-edge-atlas-primes-le-100-summary.json').read_text()
          )
          assert generated_summary == committed_summary

          with (generated_dir / 'prime-pair-edge-atlas-primes-le-100.csv').open(newline='') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 300
          assert rows[0]['p'] == '2' and rows[0]['q'] == '3'
          assert rows[0]['kappa_plus'] == '0' and rows[0]['kappa_minus'] == '-1'
          assert any(r['p'] == '2' and r['q'] == '5' and r['both_level_preserved'] == 'true' for r in rows)
          print('PVG prime-pair edge atlas regeneration: PASS')
          PY
      - name: Execute safe worktree sync script
        shell: pwsh
        run: |
          git fetch --prune origin agent/pvg-point-classification-inverse-geometry-001:refs/remotes/origin/agent/pvg-point-classification-inverse-geometry-001
          $worktree = Join-Path $env:RUNNER_TEMP 'pvg-inverse-geometry-worktree'
          ./tools/sync_pvg_inverse_geometry_worktree.ps1 `
            -Repo $PWD.Path `
            -Worktree $worktree `
            -Python 'python'
      - name: Large unfactored input must be refused
        run: |
          set +e
          python tools/pvg_inverse_geometry.py 18446744073709551616 --compact > /tmp/refusal.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/refusal.json').read_text())
          assert p['status'] == 'exact_location_not_certified'
          print('Honest refusal gate: PASS')
          PY
