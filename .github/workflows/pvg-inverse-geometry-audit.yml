name: PVG Inverse Geometry Audit

on:
  pull_request:
    paths:
      - 'maps/pvg-point-classification-and-inverse-geometry-v1.md'
      - 'maps/pvg-local-neighborhood-and-axis-ratio-geometry-v1.md'
      - 'research/pvg-space-deepening/**'
      - 'tools/pvg_*.py'
      - 'tools/sync_pvg_inverse_geometry_worktree.ps1'
      - 'tests/test_pvg_*.py'
      - 'governance/programs/PVG-INVERSE-GEOMETRY-001.md'
      - 'governance/checkpoints/PVG-INVERSE-GEOMETRY-001.md'
      - '.github/workflows/pvg-inverse-geometry-audit.yml'
  push:
    branches: [main]
    paths:
      - 'maps/pvg-point-classification-and-inverse-geometry-v1.md'
      - 'maps/pvg-local-neighborhood-and-axis-ratio-geometry-v1.md'
      - 'research/pvg-space-deepening/**'
      - 'tools/pvg_*.py'
      - 'tools/sync_pvg_inverse_geometry_worktree.ps1'
      - 'tests/test_pvg_*.py'
      - 'governance/programs/PVG-INVERSE-GEOMETRY-001.md'
      - 'governance/checkpoints/PVG-INVERSE-GEOMETRY-001.md'
      - '.github/workflows/pvg-inverse-geometry-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile tools/pvg_inverse_geometry.py tools/pvg_local_neighborhood.py
          python -m py_compile tools/pvg_prime_pair_edge_atlas.py tools/pvg_prime_triangle_atlas.py
          python -m py_compile tools/pvg_prime_triangle_dynamics.py tools/pvg_prime_tetrahedron_atlas.py
          python -m py_compile tools/pvg_prime_simplex_general.py tools/pvg_arithmetic_terrain.py
          python -m py_compile tools/pvg_level_terrain.py tools/pvg_level_flow.py
          python -m py_compile tests/test_pvg_*.py
      - name: PowerShell sync-script syntax check
        shell: pwsh
        run: |
          $source = Get-Content -Raw tools/sync_pvg_inverse_geometry_worktree.ps1
          $null = [scriptblock]::Create($source)
      - name: Unit tests
        run: |
          python -m unittest -v tests/test_pvg_inverse_geometry.py
          python -m unittest -v tests/test_pvg_local_neighborhood.py
          python -m unittest -v tests/test_pvg_prime_pair_edge_atlas.py
          python -m unittest -v tests/test_pvg_prime_triangle_atlas.py
          python -m unittest -v tests/test_pvg_prime_triangle_dynamics.py
          python -m unittest -v tests/test_pvg_prime_tetrahedron_atlas.py
          python -m unittest -v tests/test_pvg_prime_simplex_general.py
          python -m unittest -v tests/test_pvg_arithmetic_terrain.py
          python -m unittest -v tests/test_pvg_level_terrain.py
          python -m unittest -v tests/test_pvg_level_flow.py
      - name: Core smoke tests
        run: |
          python tools/pvg_inverse_geometry.py 900 --compact > /tmp/passport.json
          python tools/pvg_local_neighborhood.py 30 --steps 3 --compact > /tmp/local.json
          python tools/pvg_prime_simplex_general.py '2,3,5,7,11' --compact > /tmp/simplex.json
          python tools/pvg_arithmetic_terrain.py 60 2 3 --factors '2^2,3,5' --compact > /tmp/edge-terrain.json
          python tools/pvg_level_terrain.py '2,3,5' 6 --compact > /tmp/level-terrain.json
          python tools/pvg_level_flow.py '2,3,5' 6 --compact > /tmp/level-flow.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/passport.json').read_text()); b=json.loads(Path('/tmp/local.json').read_text())
          c=json.loads(Path('/tmp/simplex.json').read_text()); d=json.loads(Path('/tmp/edge-terrain.json').read_text())
          e=json.loads(Path('/tmp/level-terrain.json').read_text()); f=json.loads(Path('/tmp/level-flow.json').read_text())
          assert a['support']==[2,3,5] and a['Omega']==6
          assert {x['neighbor'] for x in b['primitive_horizontal_neighbors']}=={12,18,20,45,50,75}
          assert c['pair_sum_reconstruction']==[2,3,5,7,11] and all(c['verification'].values())
          assert d['before']['n']==60 and d['after']['n']==90 and all(d['verification'].values())
          assert e['point_count']==28 and e['extrema']['tau']['maximum_points']==[[2,2,2]] and all(e['verification'].values())
          assert f['fields']['tau']['global_maxima']==[[2,2,2]] and all(f['verification'].values())
          PY
      - name: Prime-pair atlas regeneration
        run: |
          mkdir -p /tmp/pair
          python tools/pvg_prime_pair_edge_atlas.py --limit 100 --output-dir /tmp/pair
          python - <<'PY'
          import csv,json
          from pathlib import Path
          g=json.loads(Path('/tmp/pair/prime-pair-edge-atlas-primes-le-100-summary.json').read_text())
          c=json.loads(Path('research/pvg-space-deepening/data/prime-pair-edge-atlas-primes-le-100-summary.json').read_text())
          assert g==c
          with Path('/tmp/pair/prime-pair-edge-atlas-primes-le-100.csv').open(newline='') as h: assert len(list(csv.DictReader(h)))==300
          PY
      - name: Prime-triangle atlas regeneration
        run: |
          mkdir -p /tmp/triangle
          python tools/pvg_prime_triangle_atlas.py --limit 100 --output-dir /tmp/triangle
          python - <<'PY'
          import csv,json
          from pathlib import Path
          g=json.loads(Path('/tmp/triangle/prime-triangle-atlas-primes-le-100-summary.json').read_text())
          c=json.loads(Path('research/pvg-space-deepening/data/prime-triangle-atlas-primes-le-100-summary.json').read_text())
          assert g==c and all(g['verification'].values())
          with Path('/tmp/triangle/prime-triangle-atlas-primes-le-100.csv').open(newline='') as h: assert len(list(csv.DictReader(h)))==2300
          PY
      - name: Prime-triangle dynamics regeneration
        run: |
          mkdir -p /tmp/dynamics
          python tools/pvg_prime_triangle_dynamics.py --limit 100 --output-dir /tmp/dynamics
          python - <<'PY'
          import csv,json
          from pathlib import Path
          g=json.loads(Path('/tmp/dynamics/prime-triangle-dynamics-primes-le-100-summary.json').read_text())
          c=json.loads(Path('research/pvg-space-deepening/data/prime-triangle-dynamics-primes-le-100-summary.json').read_text())
          assert g==c and all(g['verification'].values())
          with Path('/tmp/dynamics/prime-triangle-dynamics-primes-le-100.csv').open(newline='') as h: assert len(list(csv.DictReader(h)))==2300
          PY
      - name: Prime-tetrahedron atlas regeneration
        run: |
          mkdir -p /tmp/tetrahedron
          python tools/pvg_prime_tetrahedron_atlas.py --limit 100 --output-dir /tmp/tetrahedron
          python - <<'PY'
          import csv,json
          from pathlib import Path
          g=json.loads(Path('/tmp/tetrahedron/prime-tetrahedron-atlas-primes-le-100-summary.json').read_text())
          c=json.loads(Path('research/pvg-space-deepening/data/prime-tetrahedron-atlas-primes-le-100-summary.json').read_text())
          assert g==c and all(g['verification'].values())
          with Path('/tmp/tetrahedron/prime-tetrahedron-atlas-primes-le-100.csv').open(newline='') as h: assert len(list(csv.DictReader(h)))==12650
          PY
      - name: Execute safe worktree sync script
        shell: pwsh
        run: |
          git fetch --prune origin agent/pvg-point-classification-inverse-geometry-001:refs/remotes/origin/agent/pvg-point-classification-inverse-geometry-001
          $worktree = Join-Path $env:RUNNER_TEMP 'pvg-inverse-geometry-worktree'
          ./tools/sync_pvg_inverse_geometry_worktree.ps1 -Repo $PWD.Path -Worktree $worktree -Python 'python'
      - name: Large unfactored input must be refused
        run: |
          set +e
          python tools/pvg_inverse_geometry.py 18446744073709551616 --compact > /tmp/refusal.json
          code=$?
          set -e
          test "$code" -eq 2
