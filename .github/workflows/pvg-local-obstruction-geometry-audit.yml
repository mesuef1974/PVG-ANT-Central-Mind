name: PVG Local Obstruction Geometry Audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  local-obstruction-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/pvg_local_obstruction_geometry.py tests/test_pvg_local_obstruction_geometry.py tools/diagnose_pvg_local_obstruction_tests.py
      - name: Run focused diagnostic contracts
        run: python tools/diagnose_pvg_local_obstruction_tests.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_pvg_local_obstruction_geometry.py
      - name: Verify governed summary
        run: |
          python tools/pvg_local_obstruction_geometry.py --compact > /tmp/local-obstruction-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/local-obstruction-summary.json').read_text())
          checks = payload['checks']
          assert checks['owner_equivalence_all_candidates']
          assert checks['local_survival_not_sufficient']
          assert checks['phase_d_not_used']
          assert checks['no_primality_test_claim']
          assert payload['scope']['local_prime_limit'] == 11
          assert payload['scope']['local_primes'] == [3, 5, 7, 11]
          assert payload['totals']['even_candidate_count'] > payload['totals']['even_owner_count']
          PY
