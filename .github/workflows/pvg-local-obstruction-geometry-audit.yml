name: PVG Local Obstruction Geometry Quarantine Audit

on:
  workflow_dispatch:

jobs:
  local-obstruction-geometry-candidate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate status notice
        run: |
          echo 'CANDIDATE-LOCAL-OBSTRUCTION-GEOMETRY-001 is deferred and non-governing.'
          echo 'This manual workflow is not a required PR or Phase-C closure check.'
      - name: Syntax check
        run: python -m py_compile tools/pvg_local_obstruction_geometry.py tests/test_pvg_local_obstruction_geometry.py tools/diagnose_pvg_local_obstruction_tests.py
      - name: Run focused diagnostic contracts
        run: python tools/diagnose_pvg_local_obstruction_tests.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_pvg_local_obstruction_geometry.py
      - name: Generate candidate summary
        run: |
          python tools/pvg_local_obstruction_geometry.py --compact > /tmp/local-obstruction-summary.json
          python -m json.tool /tmp/local-obstruction-summary.json > /dev/null
