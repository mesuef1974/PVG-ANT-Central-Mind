name: AVRG PASS034 nonoverlap analysis

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile PASS034
        run: python -m py_compile research/avrg-axis-sum/code/avrg_pass034.py research/avrg-axis-sum/code/test_avrg_pass034.py

      - name: Run PASS034 safety tests
        run: python -m unittest discover -v -s research/avrg-axis-sum/code -p 'test_avrg_pass034.py'

      - name: Run locked full analysis
        run: python research/avrg-axis-sum/code/avrg_pass034.py --progress

      - name: Record result digest
        run: sha256sum research/avrg-axis-sum/results/avrg_pass034_results.json | tee avrg_pass034_result_sha256.txt

      - name: Upload locked result
        uses: actions/upload-artifact@v4
        with:
          name: avrg-pass034-nonoverlap-result
          path: |
            research/avrg-axis-sum/results/avrg_pass034_results.json
            avrg_pass034_result_sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Commit locked result to the research branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/avrg-axis-sum/results/avrg_pass034_results.json
          if git diff --cached --quiet; then
            echo "Locked PASS034 result already committed"
          else
            git commit -m "PASS034: record locked nonoverlap result"
            git push origin HEAD:${{ github.head_ref }}
          fi
