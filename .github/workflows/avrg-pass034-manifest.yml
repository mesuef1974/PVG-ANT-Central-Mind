name: AVRG PASS034 manifest refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate manifest and checksums
        run: python .github/scripts/refresh_avrg_manifest.py

      - name: Verify checksums
        working-directory: research/avrg-axis-sum
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload refreshed metadata
        uses: actions/upload-artifact@v4
        with:
          name: avrg-pass034-manifest
          path: |
            research/avrg-axis-sum/MANIFEST.json
            research/avrg-axis-sum/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
