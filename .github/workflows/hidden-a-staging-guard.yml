name: Hidden A Staging Guard

# Protects the committed STEP A artifacts of ADVERSARIAL-PVG-ANT-BENCHMARK-002:
# blocks any plaintext gold-key leakage and re-checks the frozen invariants (axis counts,
# closed vocabularies, quota minima, key-hash shape) WITHOUT the owner-held gold keys.
# Standalone workflow — does not touch the required governance-gate.

on:
  pull_request:
    paths:
      - "benchmarks/pvg-ant-002/**"
      - "tools/hidden_a_staging_guard.py"
      - ".github/workflows/hidden-a-staging-guard.yml"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hidden A staging guard
        run: python tools/hidden_a_staging_guard.py
