name: Hidden Set Staging Guard

# Protects the committed hidden-set staging artifacts of ADVERSARIAL-PVG-ANT-BENCHMARK-002
# (Set A, and Set B before any B artifact exists):
# blocks any plaintext gold-key leakage and re-checks the frozen invariants (axis counts,
# closed vocabularies, quota minima, key-hash shape) WITHOUT the owner-held gold keys.
# Standalone workflow — does not touch the required governance-gate.

on:
  pull_request:
    paths:
      - "benchmarks/pvg-ant-002/**"
      - "tools/hidden_set_staging_guard.py"
      - ".github/workflows/hidden-set-staging-guard.yml"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hidden-set staging guard
        run: python tools/hidden_set_staging_guard.py
